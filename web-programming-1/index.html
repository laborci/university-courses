<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Programming 1 Docs</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header class="topbar">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
            <span>University Courses</span>
        </div>
        <div class="language-selector">
            <select id="lang-select">
                <!-- Populated by JS -->
            </select>
        </div>
        <button id="mobile-menu-btn" aria-label="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
    </header>

    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <nav id="nav-tree">
                <!-- Populated by JS -->
            </nav>
        </aside>

        <main class="content-wrapper">
            <article id="content" class="markdown-body">
                <div class="loader">Loading content...</div>
            </article>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
